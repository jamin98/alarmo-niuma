; 牛马办公室 - M5Stack Core2 屏幕端。用 PlatformIO 编译和烧录:
;   pio run -t upload        (Core2 用 USB-C 接电脑，Windows / Linux / macOS 都行)
;   pio device monitor       (看串口日志)
[env:m5stack-core2]
platform = espressif32@6.5.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    m5stack/M5Unified@^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
